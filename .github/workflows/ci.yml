name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install 3.11
      - name: Sync deps
        run: uv sync --extra dev
      # ponytail: lint/format/typing 暂不阻塞（基线 format 57 文件、ruff 7、mypy 19）。
      # 升级路径：清完欠账后逐个去掉 continue-on-error 恢复硬门禁。
      - name: Ruff format
        run: uv run ruff format --check .
        continue-on-error: true
      - name: Ruff check
        run: uv run ruff check .
        continue-on-error: true
      - name: Mypy
        run: uv run mypy src/
        continue-on-error: true
      - name: Pytest
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=65

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm run test
      - name: Build (includes vue-tsc)
        run: npm run build

  docker-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
